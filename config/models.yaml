# Paperclip Model Configuration
# Maps roles to primary and fallback models for automatic failover
# Format: role -> { primary: "provider/model", fallback: "provider/model" }
#
# When the primary model returns 429 (quota exceeded) or 5xx (server error),
# the system will retry once, then switch to the fallback model.

model_mapping:
  # Governance agents - high reliability, conservative models
  governance:
    primary: "anthropic/claude-3-opus-20240229"
    fallback: "anthropic/claude-3-sonnet-20240229"
  
  # Sales agents - cost-optimized, faster models
  sales:
    primary: "openai/gpt-4-turbo"
    fallback: "openai/gpt-4o"
  
  # Developer agents - latest capabilities
  developer:
    primary: "openai/gpt-4o"
    fallback: "anthropic/claude-3-sonnet-20240229"
  
  # Default fallback for any role not explicitly mapped
  default:
    primary: "openai/gpt-4o"
    fallback: "openai/gpt-4-turbo"

# Quota warning threshold (percentage)
# When quota usage reaches this threshold, surface warning in Usage view
quota_warning_threshold: 80

# Retry configuration
retry:
  max_retries: 1
  retry_on_status_codes: [429, 500, 502, 503, 504]
  backoff_ms: 1000